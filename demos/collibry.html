<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050b1d">
<title>Collibry — Booth Walkthrough</title>
<script>
(function(){var errs=[];window.__errs=errs;
window.addEventListener('error',function(e){errs.push((e.message||'error')+(e.filename?' ('+String(e.filename).split('/').pop().slice(0,30)+(e.lineno?':'+e.lineno:'')+')':''))});
window.addEventListener('unhandledrejection',function(e){errs.push('promise: '+((e.reason&&e.reason.message)||e.reason))});
window.__bootcheck=setTimeout(function(){if(window.__ready)return;var b=document.getElementById('boot');if(b)b.remove();var d=document.createElement('div');d.id='bootmsg';
d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1530;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center';
d.innerHTML='<div style="max-width:560px"><div style="font-size:22px;font-weight:800;margin-bottom:8px">The demo did not finish loading</div><div style="opacity:.85">Please reload the page. If this message appears again, open the file in Safari or Chrome and send a screenshot of this screen.</div><div style="margin-top:14px;font-size:12px;opacity:.6;word-break:break-word">'+String(errs.join(" | ")||"no error reported (the file may have been cut short while loading)").replace(/</g,"&lt;")+'</div><button onclick="location.reload()" style="margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#1495dc;color:#fff;font-weight:800;font-size:15px">Reload</button></div>';
document.body.appendChild(d)},4500)})();

</script>
<style>
#boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#050b1d;color:rgba(255,255,255,.75);font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.02em}
:root{--brand:#1495dc;--brand2:#39b8f0;--navy:#050b1d;--navy2:#0a2a5c;--paper:#f2f7fc;--ink:#0b1220;--muted:#56657c;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:48px clamp(14px,2.4vw,34px) 84px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transition-delay:0s;z-index:2}
.slide-dark{color:#fff;background:radial-gradient(1100px 700px at 88% 8%,rgba(57,184,240,.34),transparent 60%),radial-gradient(900px 600px at 6% 96%,rgba(20,149,220,.22),transparent 60%),linear-gradient(135deg,#040a1b 0%,#08214a 55%,#0b4a86 130%)}
.slide-light{color:var(--ink);background:radial-gradient(1000px 640px at 92% 4%,rgba(57,184,240,.20),transparent 60%),radial-gradient(800px 560px at 4% 100%,rgba(20,149,220,.11),transparent 62%),linear-gradient(180deg,#f7fafe,#eaf2fb)}
.eyebrow{font-size:clamp(.78rem,1.25vw,.92rem);font-weight:700;letter-spacing:.02em;color:#0b86d0}
.slide-dark .eyebrow{color:#7cc9f4}
h1.h{font-size:clamp(1.55rem,2.75vw,2.6rem);line-height:1.12;font-weight:800;letter-spacing:-.025em;margin-top:.4rem}
.body{margin-top:.95rem;display:flex;flex-direction:column;gap:.7rem;max-width:44ch}
.body p{font-size:clamp(.92rem,1.3vw,1.06rem);line-height:1.55;color:var(--muted)}
.slide-dark .body p{color:rgba(255,255,255,.78)}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:clamp(18px,2.2vw,38px);align-items:center;width:100%;height:100%;max-width:1780px}
.txt{min-width:0;position:relative}
.vis{position:relative;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stagew{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.wcol{display:flex;flex-direction:column;align-items:stretch;flex:none}
/* View more: the only solid/filled button on a slide */
.more-btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 22px;margin-top:22px;border:0;border-radius:12px;cursor:pointer;font:inherit;font-size:.94rem;font-weight:800;letter-spacing:.005em;color:#fff;background:linear-gradient(135deg,#1aa5ec,#0a7bcf);box-shadow:0 12px 26px -8px rgba(20,149,220,.6);touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:transform .2s,box-shadow .2s}
.more-btn:active{transform:scale(.97)}
.more-btn .chev{width:17px;height:17px;transition:transform .35s ease}
.txt.open .more-btn .chev{transform:rotate(180deg)}
.more{position:absolute;left:0;right:0;top:100%;margin-top:18px;overflow:hidden;max-height:0;opacity:0;transition:max-height .5s ease,opacity .35s ease;pointer-events:none}
.txt.open .more{max-height:480px;opacity:1;pointer-events:auto}
.more::before{content:"";display:block;width:38px;height:3px;border-radius:2px;background:var(--brand2);margin-bottom:14px}
.more .body{margin-top:0}
/* status label: plain text, deliberately not button-like */
.vbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;margin-bottom:10px;min-height:36px}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;letter-spacing:.01em;color:#0b6fb0;transition:opacity .4s}
.slide-dark .stat{color:rgba(255,255,255,.92)}
.stat .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:bdot 1.6s ease-out infinite}
.stat .dot.rec{background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation-name:bdotr}
@keyframes bdot{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes bdotr{70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.stat.pending{opacity:.4}
.stat.pop{animation:bpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bpop{0%{transform:scale(.92)}100%{transform:scale(1)}}
/* demo controls: Replay = plain text link, Enlarge = small outlined square button */
.vctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.lnk,.outl{display:inline-flex;align-items:center;height:36px;font:inherit;font-size:.84rem;font-weight:700;line-height:1;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;white-space:nowrap}
.lnk{padding:0 10px;border:0;background:none;color:inherit;opacity:.72}
.lnk:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.outl{padding:0 13px;border-radius:9px;border:1.5px solid rgba(11,18,32,.24);background:rgba(255,255,255,.6);color:var(--ink)}
.slide-dark .outl{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.08);color:#fff}
.lnk .ico,.outl .ico{width:15px;height:15px;margin-right:7px;flex:none;fill:none}
/* UI windows */
.uiw{position:relative;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(3,10,30,.55),0 0 0 1px rgba(20,40,80,.14)}
.slide-dark .uiw{box-shadow:0 30px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14)}
.ui{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k,.5))}
.vis.exp{position:fixed;inset:0;z-index:900;height:auto;background:rgba(3,7,18,.94);padding:66px 18px 18px}
.vis.exp .vbar{display:none}
.vis.exp .uiw{box-shadow:0 30px 90px rgba(0,0,0,.7)}
.xc{display:none;position:fixed;right:16px;top:14px;z-index:950;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;place-items:center;cursor:pointer}
body.exp .xc{display:grid}
body.exp #navbar,body.exp #progress{visibility:hidden}
body.exp .slide.active{z-index:800}
/* progress + nav */
#progress{position:absolute;top:max(2.2vh,14px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.dot{width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);transition:background .3s ease}
.dot.filled{background:#fff}
#progress.on-light .dot{background:rgba(11,18,32,.14)}
#progress.on-light .dot.filled{background:var(--brand)}
#navbar{position:absolute;bottom:0;left:0;right:0;height:clamp(60px,9vh,82px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.16),transparent)}
#navbar.on-light{background:linear-gradient(to top,rgba(20,60,110,.06),transparent)}
#navbar>*{pointer-events:auto}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;transition:opacity .2s}
.navbtn svg{display:block}
#navbar.on-light .navbtn{background:rgba(11,18,32,.07);color:var(--ink)}
.navbtn:disabled{opacity:.3;cursor:default}
.restart{cursor:pointer;font-size:.84rem;font-weight:700;padding:11px 18px;border-radius:999px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);display:none}
/* cover + closing */
.center{flex-direction:column;text-align:center}
.lockup{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,18px);margin-bottom:clamp(14px,2.6vh,26px)}
.lockup .word{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.03em;color:#fff}
.kicker{font-size:clamp(.86rem,1.5vw,1.08rem);font-weight:700;color:#7cc9f4;letter-spacing:.02em}
.cover-h{font-size:clamp(1.9rem,4.9vw,3.9rem);line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:19ch;margin:.55rem auto 0}
.cover-s{margin:1rem auto 0;font-size:clamp(.95rem,1.7vw,1.22rem);line-height:1.5;color:rgba(255,255,255,.8);max-width:46ch}
.hintline{margin-top:clamp(18px,3.4vh,34px);font-size:clamp(.85rem,1.4vw,1rem);font-weight:600;color:rgba(255,255,255,.7)}
.cover .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.slide-brand{color:#fff;background:radial-gradient(900px 620px at 88% 6%,rgba(130,224,255,.5),transparent 60%),radial-gradient(800px 600px at 4% 98%,rgba(8,60,150,.6),transparent 62%),linear-gradient(135deg,#0a3d84 0%,#1272c6 52%,#33b3f0 118%)}
.closing{--qr:clamp(190px,min(44vh,27vw),330px)}
.glass{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) auto;align-items:center;gap:clamp(28px,4.5vw,76px);width:100%;max-width:1080px;padding:clamp(28px,5.5vh,58px) clamp(30px,5vw,76px);border-radius:clamp(24px,3vw,36px);text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.4);box-shadow:0 30px 80px rgba(2,24,70,.4),inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}
.glass .lockup{justify-content:flex-start;margin-bottom:0}
.ltile{display:grid;place-items:center;width:clamp(52px,6vw,68px);height:clamp(52px,6vw,68px);border-radius:clamp(15px,1.8vw,20px);background:#fff;box-shadow:0 10px 26px rgba(2,24,70,.3)}
.ltile svg{width:62%;height:auto}
.closing-h{margin-top:clamp(16px,3vh,30px);font-size:clamp(1.9rem,3.9vw,3.5rem);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.gl-r{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff}
.qrbox{display:flex;padding:clamp(8px,1vw,12px);background:#fff;border-radius:clamp(18px,2vw,26px);box-shadow:0 22px 54px rgba(2,20,60,.4)}
.qrbox svg{width:var(--qr);height:var(--qr);display:block;border-radius:clamp(10px,1.2vw,16px)}
.qrcap{margin-top:clamp(12px,2vh,20px);font-weight:700;font-size:clamp(.95rem,1.5vw,1.15rem);letter-spacing:.01em}
/* responsive */
@media (orientation:portrait) and (max-width:1100px){
  .slide{padding:44px 20px 80px}
  .split{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:16px;align-items:center;justify-items:stretch;max-width:900px}
  .vis{order:-1;height:100%;min-height:0}
  .txt{text-align:left}
  h1.h{font-size:clamp(1.5rem,5.2vw,2.3rem)}
  .body{max-width:60ch}
  .more{position:static;margin-top:0}
  .txt.open .more{margin-top:16px}
  .closing{--qr:clamp(180px,min(32vh,62vw),320px)}
  .glass{grid-template-columns:1fr;justify-items:center;text-align:center;gap:26px}
  .glass .lockup{justify-content:center}
}
@media (max-width:620px){.body p{font-size:.9rem}.acts{gap:8px}}
@media (prefers-reduced-motion:reduce){.stat .dot{animation:none}}


.vnote{margin-top:8px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.3;opacity:.85}

/* the whole app screen sits, uncut, on a frosted-glass panel with softly rounded corners */
.uiw.gpanel{border-radius:14px;overflow:visible;background:linear-gradient(150deg,rgba(255,255,255,.36),rgba(255,255,255,.11));box-shadow:0 0 0 1px rgba(255,255,255,.34),0 30px 70px -20px rgba(3,10,30,.65),inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.slide-light .uiw.gpanel{background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(178,214,243,.5));box-shadow:0 0 0 1px rgba(255,255,255,.95),0 0 0 2px rgba(20,100,180,.10),0 30px 70px -22px rgba(20,60,110,.38),inset 0 1px 0 #fff}
.uis{position:relative;border-radius:0;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(20,40,80,.14),0 10px 30px rgba(2,8,30,.22)}

/* long status text is trimmed with an ellipsis; Replay/Enlarge always stay pinned to the right */
.vbar{flex-wrap:nowrap}
.stat{min-width:0;max-width:100%}
.stat>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcol{max-width:100%;min-width:0}

/* ===== Collibry light app (design width 1440) ===== */
.cl{--brand:#1495dc;--brand-d:#0e7fc0;--ink:#0f172a;--ink2:#475569;--ink3:#64748b;--line:#e5e7eb;--line2:#ebecf0;--soft:#f9fafb;
  position:relative;width:1440px;height:var(--h,720px);background:#fff;color:var(--ink);overflow:hidden;display:flex;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.35;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.cl *{box-sizing:border-box}
.cl .ic{flex:none;display:block}
:where(.cl) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.cl-side{width:246px;flex:none;background:var(--soft);border-right:1px solid var(--line2);display:flex;flex-direction:column;position:relative;z-index:2}
.cl-brand{height:63px;flex:none;display:flex;align-items:center;padding:0 15px 0 18px;position:relative;background:#fff;border-bottom:1px solid var(--line2);box-shadow:0 1px 2px rgba(15,23,42,.03)}
.cl-brand .name{margin-left:14px;font-size:18px;font-weight:700;color:var(--brand);letter-spacing:-.2px}
.cl-collapse{position:absolute;right:15px;top:16px;width:31px;height:31px;border-radius:50%;background:var(--brand);color:#fff;display:grid!important;place-items:center;box-shadow:0 1px 3px rgba(20,149,220,.35)}
.cl-navwrap{position:relative;flex:1;min-height:0}
.cl-nav{position:absolute;inset:0;overflow:hidden;padding:1px 0 0}
.cl-nav-in{transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.cl-item{height:51px;display:flex;align-items:center;padding:0 0 0 16px;color:var(--ink2);gap:13px;font-size:14px;font-weight:450;position:relative;white-space:nowrap}
.cl-item .ic{color:#4b5563}
.cl-item.on{color:var(--brand);font-weight:500}.cl-item.on .ic{color:var(--brand)}
.cl-item.on::after{content:"";position:absolute;right:42px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--brand)}
.cl-sbar{position:absolute;right:8px;top:8px;bottom:8px;width:5px;pointer-events:none}
.cl-sbar i{position:absolute;left:0;width:5px;border-radius:3px;background:#d9dce1}
.cl-hint{position:absolute;left:50%;bottom:16px;margin-left:-16px;width:33px;height:33px;border-radius:50%;background:rgba(238,240,243,.94);display:grid;place-items:center;color:#4b5563;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.cl-foot{flex:none;padding:0 15px 9px;border-top:0}
.cl-plan{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 12px 11px;margin-bottom:11px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cl-plan .l{font-size:11.5px;color:var(--ink2);font-weight:500}
.cl-plan .bar{height:6px;border-radius:4px;background:#22c55e;margin:8px 0 9px}
.cl-plan .t{font-size:14px;font-weight:700;color:#16a34a;letter-spacing:-.1px}
.cl-user{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cl-user .av{width:38px;height:38px;border-radius:50%;background:#2f6df0;display:grid;place-items:center;color:#fff;flex:none}
.cl-user .who{min-width:0;flex:1}.cl-user .who b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-user .who span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-user .crown{color:#f59e0b}.cl-user .pp{color:#64748b}
.cl-main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:#fff}
.cl-top{height:63px;flex:none;border-bottom:1px solid var(--line2);background:#fff}
.cl-body{flex:1;min-height:0;position:relative;overflow:hidden}
.cl-wrap{max-width:1024px;margin:0 auto;padding-top:27px}
.cl h1.pt{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;color:#0b0f1a}
.cl .ps{margin:9px 0 0;font-size:14.5px;color:var(--ink2)}
/* sora */
.cl-sora{position:absolute;right:14px;bottom:10px;display:flex;align-items:center;gap:9px;z-index:5}
.cl-sora .pill{display:flex;align-items:center;gap:10px;height:38px;padding:0 16px;border-radius:19px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(15,23,42,.1);font-size:14px;font-weight:500;color:#111}
.cl-sora .pill .ic{color:var(--brand)}
.cl-sora .orb{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(20,149,220,.12),0 6px 16px rgba(20,149,220,.35)}
/* tabs */
.cl-tabs{display:flex;align-items:center;gap:0;margin-top:54px;padding-bottom:14px;border-bottom:1px solid var(--line2);position:relative}
.cl-tab{height:35px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13.4px;font-weight:500;border:1px solid transparent;margin-right:14px}
.cl-tab.on{background:#dceffa;border-color:#a9d8f2;color:#0a86d3}
.cl-tab .ic{color:currentColor}
.cl-tabs .sp{flex:1}
/* generator card */
.cl-card{border:1.5px solid #6dbde9;border-radius:17px;background:#fff;padding:26px 24px 24px;margin-top:23px;box-shadow:0 6px 22px rgba(20,149,220,.1);position:relative}
.cl-gh{display:flex;gap:13px;align-items:center}
.cl-gi{width:39px;height:39px;border-radius:9px;background:#e7f4fb;color:var(--brand);display:grid;place-items:center;flex:none}
.cl-gt{font-size:17px;font-weight:700;letter-spacing:-.2px}
.cl-gs{font-size:14px;color:var(--ink2);margin-top:2px}
.cl-lab{margin-top:18px;font-size:14px;font-weight:500;color:#0f172a}
.cl-help{margin-top:7px;font-size:11.8px;color:var(--ink2)}
.cl-ta{margin-top:8px;height:121px;border:1px solid #e5e7eb;border-radius:13px;background:var(--soft);padding:15px 15px;font-size:14px;color:#8b95a6;line-height:1.5;overflow:hidden;position:relative}
.cl-ta.filled{color:#1e293b;background:#fff;border-color:#a9d8f2}
.cl-chk{display:flex;align-items:center;gap:10px;margin-top:17px;font-size:12.8px;color:#1e293b}

/* ===== Collibry meeting room (dark) — design width 1480 ===== */
.cm{--bg:#040616;--pn:#121729;--pn2:#1a2031;--bd:#2b3345;--bd2:#1c2233;--card:#1e2437;--cardb:#333c4f;--btn:#22293a;--ic:#a9bcf2;--txt:#fff;--mut:#9aa3b5;--acc:#7aa5f4;--ind:#5b7fed;

.cm *{box-sizing:border-box}.cm .ic{flex:none;display:block}

.cm-rec{display:none;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:13px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.5);font-size:12px;font-weight:700;color:#fca5a5;letter-spacing:.3px}

.cm-stage{position:absolute;left:0;right:0;top:66px;bottom:0}
.cm-tile{position:absolute;border-radius:16px;background:#232324;border:1px solid #2a2b2f;overflow:hidden}
.cm-tile .sig{position:absolute;left:10px;top:9px;color:#34d399;opacity:.9}
.cm-av{position:absolute;left:50%;top:50%;width:var(--av,80px);height:var(--av,80px);margin:calc(var(--av,80px)/-2) 0 0 calc(var(--av,80px)/-2);border-radius:50%;background:linear-gradient(160deg,#6285f0,#4c69e6);display:grid;place-items:center;font-weight:700;font-size:calc(var(--av,80px)*.28);color:#fff;box-shadow:0 8px 24px rgba(58,90,220,.28)}

.cm-name{position:absolute;left:14px;bottom:14px;height:34px;padding:0 13px;border-radius:17px;background:#171717;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}

.cm-bar{position:absolute;bottom:13px;height:59px;padding:8px;border-radius:16px;background:var(--pn);border:1px solid var(--bd);display:flex;align-items:center;gap:6px;box-shadow:0 10px 34px rgba(0,0,0,.5);z-index:4;transform:translateX(-50%);left:50%;transition:left .4s ease}
.cm-b{height:41px;min-width:41px;border-radius:11px;background:var(--btn);color:var(--ic);display:flex!important;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;padding:0 10px;white-space:nowrap;transition:background .25s,color .25s}

.cm-g{display:flex;gap:1px;border-radius:11px;overflow:hidden}.cm-g .cm-b{border-radius:0}.cm-g .cm-b.mini{min-width:32px;padding:0 6px}
.cm-div{width:1px;height:26px;background:#2f374a;margin:0 4px;flex:none}
.cm-end{background:#cf3f27;color:#fff;border-radius:11px}
.cm-side{position:absolute;top:0;bottom:0;width:386px;background:var(--pn);border-left:1px solid #232a3d;z-index:6;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cm-side.r{right:0}.cm-side.l{left:0;border-left:0;border-right:1px solid #232a3d}
.cm-sh{height:63px;flex:none;background:var(--pn2);border-bottom:1px solid #2a3145;display:flex;align-items:center;gap:11px;padding:0 16px 0 17px}

.cm-live{position:relative;color:#7b9cf3}.cm-live b{position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px var(--pn2)}
.cm-drag{color:#9aa3b8;margin-right:-3px}
.cm-search{margin:14px 16px 0;height:42px;border-radius:13px;background:#232a3d;border:1px solid #333c50;display:flex;align-items:center;gap:10px;padding:0 13px;color:#8b94a8;font-size:14.5px}

.cm-sf{height:36px;flex:none;border-top:1px solid #222a3c;background:#151a2c;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;color:#a3abbb}

/* tools rows */
.cm-tools{flex:1;overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;gap:11px}
.cm-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#1d2336;border:1px solid #262e43;flex:none;text-align:left;width:100%;transition:background .3s,border-color .3s}

/* captions overlay */
.cm-cap{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;max-width:70%;padding:10px 18px;border-radius:12px;background:rgba(6,8,20,.82);border:1px solid rgba(255,255,255,.08);font-size:17px;line-height:1.4;text-align:center;opacity:0;transition:opacity .35s;z-index:3}

/* Smart Sync panel */
.sy{position:absolute;left:16px;top:80px;width:392px;height:664px;border-radius:18px;background:#121729;border:1px solid #2a3145;display:flex;flex-direction:column;z-index:5;box-shadow:0 20px 50px rgba(0,0,0,.45)}

.sy-bar{height:8px;border-radius:4px;background:#252d44;overflow:hidden}

M.doCopy=function(){ this.copy.classList.add('ok'); this.ct.textContent='Link copied'; setTimeout(()=>{this.copy.classList.remove('ok');this.ct.textContent='Copy Podcast Link'},1800); };
M.setMute=function(who,m){
  const t=who==='me'?this.me:this.g; const mo=t.querySelector('.mo'); mo.style.display=m?'':'none';
  if(who==='me'){ this.mic.classList.toggle('on',!m); this.mi.innerHTML=ic(m?'mic-off':'mic',18,'',1.9); }
};
M.key=function(t){ return t.classList.contains('me')?'me':'g'; };
M.startImg=function(t){ const im=t.querySelector('.pw'); if(!im)return; im.removeAttribute('src'); void im.offsetWidth; im.src=WEBP()[this.key(t)]; };
M.toWebp=function(t,why){
  const k=this.key(t), uri=WEBP()[k], v=t.querySelector('.pv'); if(v){ try{v.pause()}catch(e){} v.remove(); } clearTimeout(t._wd); t.classList.remove('hasv');
  if(!uri) return this.toFigure(t,why);
  if(!t.querySelector('.pw')){ const im=document.createElement('img'); im.className='pw'; im.alt=''; im.decoding='async'; const self=this; im.addEventListener('error',()=>{ if(im.getAttribute('src'))self.toFigure(t,'animated image error'); }); t.insertBefore(im,t.firstChild); }
  t.classList.add('hasw'); if(t.classList.contains('cam'))this.startImg(t);
};
M.toFigure=function(t,why){
  const on=t.classList.contains('cam'); clearTimeout(t._wd); t.querySelectorAll('.pv,.pw').forEach(x=>x.remove()); t.classList.remove('hasv','hasw');
  if(!t.querySelector('svg.vid')) t.insertAdjacentHTML('afterbegin',pdFig(this.key(t)==='me'?'h':'g')); if(on)t.classList.add('cam');
  this.note('Real clips could not be shown ('+why+') – showing drawn people instead');
};
M.watch=function(t,v){ clearTimeout(t._wd); t._wd=setTimeout(()=>{ if(!t.classList.contains('cam')||!t.classList.contains('hasv'))return; if(v.paused||v.readyState<2||v.currentTime<0.05)this.toWebp(t,'video would not start'); },2400); };
M.camVideo=function(t,on){
  const v=t.querySelector('.pv'); if(!v)return;
  const apply=()=>{ t.classList.toggle('cam',on); if(on){ const pr=v.play(); pr&&pr.catch&&pr.catch(()=>{}); this.watch(t,v); } else { clearTimeout(t._wd); v.pause(); } };
  if(on&&v.readyState<2){ v.addEventListener('loadeddata',apply,{once:true}); try{v.load()}catch(e){} setTimeout(()=>{ if(!t.classList.contains('cam')&&t._want!==false)apply(); },1200); t._want=true; } else { t._want=on; apply(); }
};
M.setCam=function(who,on){
  const t=who==='me'?this.me:this.g;
  if(t.classList.contains('hasv'))this.camVideo(t,on);
  else if(t.classList.contains('hasw')){ t.classList.toggle('cam',on); if(on)this.startImg(t); else { const im=t.querySelector('.pw'); im&&im.removeAttribute('src'); } }
  else t.classList.toggle('cam',on);
  if(who==='me'){ this.cam.classList.toggle('on',on); this.ci.innerHTML=ic(on?'video':'video-off',18,'',1.9); }
};
M.prep=function(){ this.root.querySelectorAll('.pv').forEach(v=>{ if(v.dataset.ready)return; v.dataset.ready='1'; const k=v.closest('.pd-tile').classList.contains('me')?'me':'g'; const uri=CLIPS()[k]; if(!uri)return; v.src=blobURL(uri); v.preload='auto'; try{v.load()}catch(e){} }); };
M.note=function(msg){ const wc=this.slide&&this.slide.querySelector('.wcol'); if(!wc)return; let n=wc.querySelector('.vnote'); if(!n){ n=document.createElement('div'); n.className='vnote'; wc.appendChild(n); } n.textContent=msg; const w=wc.querySelector('.uiw'); if(w)fitWin(w); };
M.say=function(html){ this.toast.innerHTML=html; this.toast.classList.add('show'); clearTimeout(this._t); this._t=setTimeout(()=>this.toast.classList.remove('show'),2400); };
M.join=function(){ this.r.classList.add('joined'); this.cn.textContent='2'; this.say(ic('user-check',16,'',2.2)+GUEST.name+' joined the studio'); };
M.startRec=function(){ this.recording=true; this.pd.classList.add('rec'); this.start.classList.add('rec'); this.sl.textContent='Stop Recording'; this.sec=0; this.rt.textContent='00:00'; clearInterval(this._iv); this._iv=setInterval(()=>{this.sec++;this.rt.textContent=fmt(this.sec)},1000); };
M.stopRec=function(){ this.recording=false; this.pd.classList.remove('rec'); this.start.classList.remove('rec'); this.sl.textContent='Start Recording'; clearInterval(this._iv); this.spk(null); };
M.spk=function(w){ this.me.classList.toggle('spk',w==='me'); this.g.classList.toggle('spk',w==='g'); };
M.leave=function(){ clearInterval(this._iv); this.root.querySelectorAll('.pv').forEach(v=>v.pause()); this.root.querySelectorAll('.pw').forEach(im=>im.removeAttribute('src')); [this.me,this.g].forEach(t=>clearTimeout(t._wd)); };
M.reset=function(){
  clearInterval(this._iv); this.recording=false; this.pd.classList.remove('rec'); this.r.classList.remove('joined'); this.cn.textContent='1'; this.start.className='pd-start'; this.sl.textContent='Start Recording'; this.rt.textContent='00:00';
  this.copy.classList.remove('ok'); this.ct.textContent='Copy Podcast Link'; this.toast.classList.remove('show'); this.spk(null);
  this.root.querySelectorAll('.pv').forEach(v=>{ v.pause(); try{v.currentTime=0}catch(e){} }); this.root.querySelectorAll('.pw').forEach(im=>im.removeAttribute('src')); [this.me,this.g].forEach(t=>clearTimeout(t._wd));
  this.me.classList.remove('cam'); this.g.classList.remove('cam'); this.cam.classList.remove('on'); this.ci.innerHTML=ic('video-off',18,'',1.9);
  this.mic.classList.remove('on'); this.mi.innerHTML=ic('mic-off',18,'',1.9); this.me.querySelector('.mo').style.display=''; this.g.querySelector('.mo').style.display='';
};
M.play=function(ctx){
  this.prep();
  ctx.at(800,()=>this.doCopy());
  ctx.at(2300,()=>this.join());
  ctx.at(3300,()=>this.setCam('me',true));      /* you: camera on, listening */
  ctx.at(3900,()=>this.setMute('me',false));
  ctx.at(4400,()=>this.setCam('g',true));
  ctx.at(5000,()=>this.setMute('g',false));
  ctx.at(5200,()=>this.spk('g'));               /* the guest is the one talking - the highlight stays on them */
  ctx.at(5900,()=>this.start.classList.add('hl'));
  ctx.at(6500,()=>{ this.start.classList.remove('hl'); this.start.classList.add('press'); });
  ctx.at(6750,()=>{ this.start.classList.remove('press'); this.startRec(); });
};
})();

const DEMO_URL="https://www.mortgageaitoolkit.com/products/collibryai";
const SLIDES=[
 {key:'cover',type:'cover',theme:'dark'},
 {key:'sync',theme:'light',eyebrow:'Smart Sync',h:'Build the fact find while the client is talking.',body:['Collibry listens to the conversation and captures relevant client information against your fact-find questions in real time.','Advisers can review and edit the information as the meeting progresses.'],badge:{i:'📋',t:'Fact find filling live',live:1}},
 {key:'voice',theme:'dark',eyebrow:'Voice to FactFind',h:'Upload a voice recording. Get a fact find.',body:['Upload a recorded client call or audio file and Collibry turns the voice recording into a transcript and populated fact-find document.'],badge:{i:'🎙️',t:'Audio processing',live:1}},
 {key:'news',theme:'light',eyebrow:'Collibry Go',h:'Create and send newsletters from Collibry.',body:['Design and send client newsletters directly from your connected email account, without setting up a separate SMTP service.'],badge:{i:'✉️',t:'Newsletter ready',pending:1}},
 {key:'podcast',theme:'dark',eyebrow:'Podcast Studio',h:'Record and manage podcasts in one place.',body:['Start a podcast instantly or schedule a recording, then manage previous sessions from your podcast library.'],badge:{i:'🎙️',t:'Podcast recording',live:1,rec:1}},
 {key:'closing',type:'closing',theme:'brand'}
];
const REPLAY_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const XP_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const CHEV_SVG='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
let cur=-1,stage,slideEls=[];
function buildSlides(){
  stage=$('#stage');
  SLIDES.forEach((d,i)=>{
    const s=document.createElement('section'); s.className='slide slide-'+d.theme; s.dataset.key=d.key; s.dataset.i=i;
    if(d.type==='cover'){
      s.classList.add('center','cover');
      s.innerHTML='<i class="glow" style="width:420px;height:420px;right:-80px;top:-100px;background:#1495dc"></i><i class="glow" style="width:360px;height:360px;left:-100px;bottom:-60px;background:#0a5fb8"></i>'+
      '<div class="lockup">'+LOGO(72)+'<span class="word">Collibry</span></div><div class="kicker">AI-powered meetings for mortgage advisers</div>'+
      '<h1 class="cover-h">Turn every client conversation into usable mortgage data.</h1><p class="cover-s">Capture meetings, build fact finds, generate notes and keep every conversation organised.</p><p class="hintline">Swipe, or tap the arrows below →</p>';
    }else if(d.type==='closing'){
      s.classList.add('center','closing');
      s.innerHTML='<div class="glass"><div class="gl-l"><div class="lockup"><span class="ltile">'+LOGO(40)+'</span><span class="word">Collibry</span></div><h1 class="closing-h">Smarter meetings. Less admin. More done.</h1></div>'+
        '<div class="gl-r" data-url="'+DEMO_URL+'"><div class="qrbox">'+QR.svg(DEMO_URL,{dark:'#06224a'})+'</div><div class="qrcap">Scan to explore Collibry</div></div></div>';
    }else{
      const m=UI[d.key], b=d.badge;
      s.innerHTML='<div class="split"><div class="txt"><div class="eyebrow">'+d.eyebrow+'</div><h1 class="h">'+d.h+'</h1>'+
        '<button class="more-btn" aria-expanded="false" aria-controls="more-'+d.key+'"><span class="mlbl">View more</span>'+CHEV_SVG+'</button>'+
        '<div class="more" id="more-'+d.key+'"><div class="body">'+d.body.map(p=>'<p>'+p+'</p>').join('')+'</div></div></div>'+
        '<div class="vis"><div class="stagew"><div class="wcol"><div class="vbar"><span class="stat'+(b.pending?' pending':'')+'" data-b>'+(b.live?'<i class="dot'+(b.rec?' rec':'')+'"></i>':'')+'<span>'+b.i+'</span><span>'+b.t+'</span></span>'+
        '<span class="vctl"><button class="lnk replay" aria-label="Replay animation">'+REPLAY_SVG+'<span class="lbl">Replay</span></button><button class="outl enl" aria-label="Enlarge the screen">'+XP_SVG+'<span class="lbl">Enlarge</span></button></span></div>'+
        '<div class="uiw gpanel" data-w="'+m.w+'" data-h="'+m.h+'"><div class="uis"><div class="ui">'+m.html()+'</div></div></div></div></div></div></div>';
    }
    stage.appendChild(s); slideEls.push(s);
  });
  const pr=document.createElement('div'); pr.id='progress'; pr.innerHTML=SLIDES.map(()=>'<i class="dot"></i>').join(''); stage.appendChild(pr);
  const nb=document.createElement('div'); nb.id='navbar'; nb.innerHTML='<button class="navbtn" id="prev" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><button class="restart" id="restart">↺ Start again</button><button class="navbtn" id="next" aria-label="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  stage.appendChild(nb);
  const xc=document.createElement('button'); xc.className='xc'; xc.setAttribute('aria-label','Close'); xc.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'; stage.appendChild(xc);
}
function initUIs(){
  SLIDES.forEach((d,i)=>{ if(d.type)return; const s=slideEls[i],m=UI[d.key],w=$('.uiw',s); m.root=$('.ui',w); m.init&&m.init(m.root,s); fitWin(w);
    const vis=$('.vis',s); if(window.ResizeObserver) new ResizeObserver(()=>fitWin(w)).observe($('.stagew',s));
    $('.replay',s).addEventListener('click',()=>{play(i)});
    $('.enl',s).addEventListener('click',e=>{e.stopPropagation();expand(vis,true)});
    $('.more-btn',s).addEventListener('click',()=>setMore(s));
  });
  window.addEventListener('resize',()=>$$('.uiw').forEach(fitWin));
  $('.xc').addEventListener('click',()=>expand($('.vis.exp'),false));
}
function setMore(s,force){ const t=$('.txt',s),b=$('.more-btn',s); if(!t||!b)return; const open=force===undefined?!t.classList.contains('open'):force; t.classList.toggle('open',open); b.setAttribute('aria-expanded',open?'true':'false'); $('.mlbl',b).textContent=open?'View less':'View more'; }
function expand(vis,on){ if(!vis)return; vis.classList.toggle('exp',on); document.body.classList.toggle('exp',on); try{ if(parent!==window)parent.postMessage({mat:'exp',on:!!on},'*'); }catch(e){} requestAnimationFrame(()=>{fitWin($('.uiw',vis));setTimeout(()=>fitWin($('.uiw',vis)),60)}); }
function play(i){
  const d=SLIDES[i]; if(d.type)return; const m=UI[d.key],s=slideEls[i];
  const b=$('[data-b]',s); if(b&&d.badge.pending){b.classList.add('pending');b.classList.remove('pop')}
  m.reset&&m.reset(); m.play&&m.play(TL.start(),{badge:on=>{ if(!b)return; if(on){b.classList.remove('pending');b.classList.add('pop')}else{b.classList.add('pending');b.classList.remove('pop')} }});
}
function go(n){
  n=Math.max(0,Math.min(SLIDES.length-1,n)); if(n===cur)return;
  if(document.body.classList.contains('exp'))expand($('.vis.exp'),false);
  if(cur>=0){ const pd=SLIDES[cur]; if(!pd.type&&UI[pd.key].leave)UI[pd.key].leave(); }
  TL.stop(); cur=n;
  slideEls.forEach(s=>setMore(s,false));
  slideEls.forEach((s,i)=>s.classList.toggle('active',i===n));
  const light=SLIDES[n].theme==='light';
  $('#progress').classList.toggle('on-light',light); $('#navbar').classList.toggle('on-light',light);
  $$('#progress .dot').forEach((d,i)=>d.classList.toggle('filled',i<=n));
  $('#prev').disabled=n===0; const last=n===SLIDES.length-1; $('#next').style.visibility=last?'hidden':'visible'; $('#restart').style.display=last?'block':'none';
  if(!SLIDES[n].type){ const w=$('.uiw',slideEls[n]); fitWin(w); play(n); }
  try{history.replaceState(null,'','#'+n)}catch(e){}
}
function wireNav(){
  $('#prev').addEventListener('click',()=>go(cur-1)); $('#next').addEventListener('click',()=>go(cur+1)); $('#restart').addEventListener('click',()=>go(0));
  document.addEventListener('keydown',e=>{ if(e.target&&(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable))return;
    if(e.key==='Escape'&&document.body.classList.contains('exp')){expand($('.vis.exp'),false);return}
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1)} else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)} else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  });
  let sx=0,sy=0,st=0,ok=false;
  stage.addEventListener('touchstart',e=>{ok=!document.body.classList.contains('exp')&&!e.target.closest('input,textarea,[contenteditable="true"]');const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  stage.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<900){go(cur+(dx<0?1:-1))}},{passive:true});
}
window.addEventListener('DOMContentLoaded',()=>{
  buildSlides(); initUIs(); wireNav();
  const h=parseInt((location.hash||'').slice(1),10); go(isNaN(h)?0:h);
  window.__ready=1; const bt=document.getElementById('boot'); if(bt)bt.remove();
});

</script>
