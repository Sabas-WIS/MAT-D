<title>Draftlee — Booth Walkthrough</title>
<script>

window.addEventListener('unhandledrejection',function(e){errs.push('promise: '+((e.reason&&e.reason.message)||e.reason))});
window.__bootcheck=setTimeout(function(){if(window.__ready)return;var b=document.getElementById('boot');if(b)b.remove();var d=document.createElement('div');d.id='bootmsg';
d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1530;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center';
d.innerHTML='<div style="max-width:560px"><div style="font-size:22px;font-weight:800;margin-bottom:8px">The demo did not finish loading</div><div style="opacity:.85">Please reload the page. If this message appears again, open the file in Safari or Chrome and send a screenshot of this screen.</div><div style="margin-top:14px;font-size:12px;opacity:.6;word-break:break-word">'+String(errs.join(" | ")||"no error reported (the file may have been cut short while loading)").replace(/</g,"&lt;")+'</div><button onclick="location.reload()" style="margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#1495dc;color:#fff;font-weight:800;font-size:15px">Reload</button></div>';

<style>
#boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#050b1d;color:rgba(255,255,255,.75);font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.02em}
:root{--brand:#1495dc;--brand2:#39b8f0;--navy:#050b1d;--navy2:#0a2a5c;--paper:#f2f7fc;--ink:#0b1220;--muted:#56657c;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:48px clamp(14px,2.4vw,34px) 84px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transition-delay:0s;z-index:2}
.slide-dark{color:#fff;background:radial-gradient(1100px 700px at 88% 8%,rgba(57,184,240,.34),transparent 60%),radial-gradient(900px 600px at 6% 96%,rgba(20,149,220,.22),transparent 60%),linear-gradient(135deg,#040a1b 0%,#08214a 55%,#0b4a86 130%)}
.slide-light{color:var(--ink);background:radial-gradient(1000px 640px at 92% 4%,rgba(57,184,240,.20),transparent 60%),radial-gradient(800px 560px at 4% 100%,rgba(20,149,220,.11),transparent 62%),linear-gradient(180deg,#f7fafe,#eaf2fb)}
.eyebrow{font-size:clamp(.78rem,1.25vw,.92rem);font-weight:700;letter-spacing:.02em;color:#0b86d0}
.slide-dark .eyebrow{color:#7cc9f4}
h1.h{font-size:clamp(1.55rem,2.75vw,2.6rem);line-height:1.12;font-weight:800;letter-spacing:-.025em;margin-top:.4rem}
.body{margin-top:.95rem;display:flex;flex-direction:column;gap:.7rem;max-width:44ch}
.body p{font-size:clamp(.92rem,1.3vw,1.06rem);line-height:1.55;color:var(--muted)}
.slide-dark .body p{color:rgba(255,255,255,.78)}
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:clamp(18px,2.2vw,38px);align-items:center;width:100%;height:100%;max-width:1780px}
.txt{min-width:0;position:relative}
.vis{position:relative;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stagew{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.wcol{display:flex;flex-direction:column;align-items:stretch;flex:none}
/* View more: the only solid/filled button on a slide */
.more-btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 22px;margin-top:22px;border:0;border-radius:12px;cursor:pointer;font:inherit;font-size:.94rem;font-weight:800;letter-spacing:.005em;color:#fff;background:linear-gradient(135deg,#1aa5ec,#0a7bcf);box-shadow:0 12px 26px -8px rgba(20,149,220,.6);touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:transform .2s,box-shadow .2s}
.more-btn:active{transform:scale(.97)}
.more-btn .chev{width:17px;height:17px;transition:transform .35s ease}
.txt.open .more-btn .chev{transform:rotate(180deg)}
.more{position:absolute;left:0;right:0;top:100%;margin-top:18px;overflow:hidden;max-height:0;opacity:0;transition:max-height .5s ease,opacity .35s ease;pointer-events:none}
.txt.open .more{max-height:480px;opacity:1;pointer-events:auto}
.more::before{content:"";display:block;width:38px;height:3px;border-radius:2px;background:var(--brand2);margin-bottom:14px}
.more .body{margin-top:0}
/* status label: plain text, deliberately not button-like */
.vbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;margin-bottom:10px;min-height:36px}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;letter-spacing:.01em;color:#0b6fb0;transition:opacity .4s}
.slide-dark .stat{color:rgba(255,255,255,.92)}
.stat .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:bdot 1.6s ease-out infinite}
.stat .dot.rec{background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation-name:bdotr}
@keyframes bdot{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes bdotr{70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.stat.pending{opacity:.4}
.stat.pop{animation:bpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bpop{0%{transform:scale(.92)}100%{transform:scale(1)}}
/* demo controls: Replay = plain text link, Enlarge = small outlined square button */
.vctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.lnk,.outl{display:inline-flex;align-items:center;height:36px;font:inherit;font-size:.84rem;font-weight:700;line-height:1;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;white-space:nowrap}
.lnk{padding:0 10px;border:0;background:none;color:inherit;opacity:.72}
.lnk:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.outl{padding:0 13px;border-radius:9px;border:1.5px solid rgba(11,18,32,.24);background:rgba(255,255,255,.6);color:var(--ink)}
.slide-dark .outl{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.08);color:#fff}
.lnk .ico,.outl .ico{width:15px;height:15px;margin-right:7px;flex:none;fill:none}
/* UI windows */
.uiw{position:relative;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(3,10,30,.55),0 0 0 1px rgba(20,40,80,.14)}
.slide-dark .uiw{box-shadow:0 30px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14)}
.ui{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k,.5))}
.vis.exp{position:fixed;inset:0;z-index:900;height:auto;background:rgba(3,7,18,.94);padding:66px 18px 18px}
.vis.exp .vbar{display:none}
.vis.exp .uiw{box-shadow:0 30px 90px rgba(0,0,0,.7)}
.xc{display:none;position:fixed;right:16px;top:14px;z-index:950;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;place-items:center;cursor:pointer}
body.exp .xc{display:grid}
body.exp #navbar,body.exp #progress{visibility:hidden}
body.exp .slide.active{z-index:800}
/* progress + nav */
#progress{position:absolute;top:max(2.2vh,14px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.dot{width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);transition:background .3s ease}
.dot.filled{background:#fff}
#progress.on-light .dot{background:rgba(11,18,32,.14)}
#progress.on-light .dot.filled{background:var(--brand)}
#navbar{position:absolute;bottom:0;left:0;right:0;height:clamp(60px,9vh,82px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.16),transparent)}
#navbar.on-light{background:linear-gradient(to top,rgba(20,60,110,.06),transparent)}
#navbar>*{pointer-events:auto}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;transition:opacity .2s}
.navbtn svg{display:block}
#navbar.on-light .navbtn{background:rgba(11,18,32,.07);color:var(--ink)}
.navbtn:disabled{opacity:.3;cursor:default}
.restart{cursor:pointer;font-size:.84rem;font-weight:700;padding:11px 18px;border-radius:999px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);display:none}
/* cover + closing */
.center{flex-direction:column;text-align:center}
.lockup{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,18px);margin-bottom:clamp(14px,2.6vh,26px)}
.lockup .word{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.03em;color:#fff}
.kicker{font-size:clamp(.86rem,1.5vw,1.08rem);font-weight:700;color:#7cc9f4;letter-spacing:.02em}
.cover-h{font-size:clamp(1.9rem,4.9vw,3.9rem);line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:19ch;margin:.55rem auto 0}
.cover-s{margin:1rem auto 0;font-size:clamp(.95rem,1.7vw,1.22rem);line-height:1.5;color:rgba(255,255,255,.8);max-width:46ch}
.hintline{margin-top:clamp(18px,3.4vh,34px);font-size:clamp(.85rem,1.4vw,1rem);font-weight:600;color:rgba(255,255,255,.7)}
.cover .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.slide-brand{color:#fff;background:radial-gradient(900px 620px at 88% 6%,rgba(130,224,255,.5),transparent 60%),radial-gradient(800px 600px at 4% 98%,rgba(8,60,150,.6),transparent 62%),linear-gradient(135deg,#0a3d84 0%,#1272c6 52%,#33b3f0 118%)}
.closing{--qr:clamp(190px,min(44vh,27vw),330px)}
.glass{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) auto;align-items:center;gap:clamp(28px,4.5vw,76px);width:100%;max-width:1080px;padding:clamp(28px,5.5vh,58px) clamp(30px,5vw,76px);border-radius:clamp(24px,3vw,36px);text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.4);box-shadow:0 30px 80px rgba(2,24,70,.4),inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%)}
.glass .lockup{justify-content:flex-start;margin-bottom:0}
.ltile{display:grid;place-items:center;width:clamp(52px,6vw,68px);height:clamp(52px,6vw,68px);border-radius:clamp(15px,1.8vw,20px);background:#fff;box-shadow:0 10px 26px rgba(2,24,70,.3)}
.ltile svg{width:62%;height:auto}
.closing-h{margin-top:clamp(16px,3vh,30px);font-size:clamp(1.9rem,3.9vw,3.5rem);line-height:1.08;font-weight:800;letter-spacing:-.03em}
.gl-r{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff}
.qrbox{display:flex;padding:clamp(8px,1vw,12px);background:#fff;border-radius:clamp(18px,2vw,26px);box-shadow:0 22px 54px rgba(2,20,60,.4)}
.qrbox svg{width:var(--qr);height:var(--qr);display:block;border-radius:clamp(10px,1.2vw,16px)}
.qrcap{margin-top:clamp(12px,2vh,20px);font-weight:700;font-size:clamp(.95rem,1.5vw,1.15rem);letter-spacing:.01em}
/* responsive */
@media (orientation:portrait) and (max-width:1100px){
  .slide{padding:44px 20px 80px}
  .split{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:16px;align-items:center;justify-items:stretch;max-width:900px}
  .vis{order:-1;height:100%;min-height:0}
  .txt{text-align:left}
  h1.h{font-size:clamp(1.5rem,5.2vw,2.3rem)}
  .body{max-width:60ch}
  .more{position:static;margin-top:0}
  .txt.open .more{margin-top:16px}
  .closing{--qr:clamp(180px,min(32vh,62vw),320px)}
  .glass{grid-template-columns:1fr;justify-items:center;text-align:center;gap:26px}
  .glass .lockup{justify-content:center}
}
@media (max-width:620px){.body p{font-size:.9rem}.acts{gap:8px}}
@media (prefers-reduced-motion:reduce){.stat .dot{animation:none}}


.vnote{margin-top:8px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.3;opacity:.85}

/* the whole app screen sits, uncut, on a frosted-glass panel with softly rounded corners */
.uiw.gpanel{border-radius:14px;overflow:visible;background:linear-gradient(150deg,rgba(255,255,255,.36),rgba(255,255,255,.11));box-shadow:0 0 0 1px rgba(255,255,255,.34),0 30px 70px -20px rgba(3,10,30,.65),inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.slide-light .uiw.gpanel{background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(178,214,243,.5));box-shadow:0 0 0 1px rgba(255,255,255,.95),0 0 0 2px rgba(20,100,180,.10),0 30px 70px -22px rgba(20,60,110,.38),inset 0 1px 0 #fff}
.uis{position:relative;border-radius:0;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(20,40,80,.14),0 10px 30px rgba(2,8,30,.22)}

/* long status text is trimmed with an ellipsis; Replay/Enlarge always stay pinned to the right */
.vbar{flex-wrap:nowrap}
.stat{min-width:0;max-width:100%}
.stat>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcol{max-width:100%;min-width:0}

/* Draftlee deck theme: navy base + indigo-to-cyan glow (matches the logo) */
:root{--brand:#2f6fe0;--brand2:#3fd6e0;--navy:#050b1d}
html,body{background:#050b1d}
.slide-dark{background:radial-gradient(1100px 700px at 88% 8%,rgba(63,214,224,.28),transparent 60%),radial-gradient(900px 600px at 6% 96%,rgba(28,75,196,.48),transparent 60%),linear-gradient(135deg,#040a1b 0%,#0a1f52 55%,#123a7a 130%)}
.slide-dark .eyebrow{color:#8fdcf0}
.more-btn{background:linear-gradient(135deg,#37c3e0,#2059d6);box-shadow:0 12px 26px -8px rgba(40,150,220,.6)}
.more::before{background:#7a9bff}
.stat .dot{background:#22c55e}
.slide-brand{background:radial-gradient(900px 620px at 88% 6%,rgba(90,225,235,.42),transparent 60%),radial-gradient(800px 600px at 4% 98%,rgba(14,30,110,.65),transparent 62%),linear-gradient(135deg,#0a1c52 0%,#1a4c9a 52%,#2f9fd6 118%)}
.kicker{color:#9db8ff}
.ltile{width:clamp(48px,5.4vw,66px);height:clamp(48px,5.4vw,66px)}
.ltile img{height:80%;width:auto;display:block}
/* closing: centred composition with a large QR */
.closing{--qr:clamp(150px,min(31vh,24vw),290px)}
.cl-c{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:820px}
.cl-c .lockup{margin-bottom:clamp(20px,4vh,40px)}
.cl-c .closing-h{margin-top:0;font-size:clamp(1.7rem,3.5vw,3.1rem);max-width:none}
.cl-c .qrbox{margin-top:clamp(22px,4.4vh,44px)}
.cl-c .qrcap{margin-top:clamp(14px,2.4vh,22px)}
@media (orientation:portrait) and (max-width:1100px){.split{grid-template-columns:1fr}.closing{--qr:clamp(180px,min(32vh,62vw),320px)}}
.txt{transition:transform .5s cubic-bezier(.3,.8,.2,1)}
@media (orientation:portrait) and (max-width:1100px){.txt{transform:none!important}}
.wcol{min-width:0}
/* text-only cover, clean and spacious */
.cover-h{max-width:none;font-size:clamp(1.65rem,4.6vw,3.6rem);line-height:1.1;margin:clamp(22px,4vh,44px) auto 0}
.cover-s{margin:clamp(14px,2.4vh,24px) auto 0;max-width:40ch}
.cover .hintline{margin-top:clamp(28px,6vh,64px)}
.cover .lockup{margin-bottom:0}
.cover .lockup .ltile{width:clamp(56px,6vw,76px);height:clamp(56px,6vw,76px)}
@keyframes dlin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide.active.cover>*:not(.glow){animation:dlin .9s cubic-bezier(.2,.7,.2,1) both}
.slide.active.cover>.lockup{animation-delay:.05s}.slide.active.cover>.kicker{animation-delay:.18s}.slide.active.cover>.cover-h{animation-delay:.3s}.slide.active.cover>.cover-s{animation-delay:.45s}.slide.active.cover>.hintline{animation-delay:.6s}
.slide.active.closing .cl-c>*{animation:dlin .8s cubic-bezier(.2,.7,.2,1) both}
/* text block lines up with the centre of the app window */
.split .txt{margin-top:46px}
@media (orientation:portrait) and (max-width:1100px){.split .txt{margin-top:0}}
.more .body li b{color:#fff;font-weight:700}

/* ============ Draftlee app recreation (canvas 1180 x 660) ============ */
.dl{position:relative;width:1180px;height:660px;background:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#0f172a;overflow:hidden;font-size:12px;-webkit-font-smoothing:antialiased}
.dl *{box-sizing:border-box}
.dl b{font-weight:700}
.dl .lgimg{display:block;width:auto}
/* ---------- shell: top bar + sidebar + main ---------- */
.topbar{position:absolute;left:0;top:0;right:0;height:40px;background:#fff;border-bottom:1px solid #edeff3;display:flex;align-items:center;padding:0 14px;gap:14px;z-index:5}
.tb-logo{display:flex;align-items:center;gap:7px;width:150px;flex:none;overflow:hidden}
.tb-logo b{font-size:13px;font-weight:800;color:#1554d6;letter-spacing:-.01em;white-space:nowrap}
.tb-logo small{display:block;font-size:6.6px;font-weight:700;letter-spacing:.08em;color:#8b95a7;white-space:nowrap}

.tb-icons{margin-left:auto;display:flex;align-items:center;gap:14px;color:#8b95a7;flex:none}

.tb-icons .setbtn{display:flex;color:#8b95a7}
.av2{width:22px;height:22px;border-radius:50%;background:#7c5cf0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:none}
.sb{position:absolute;left:0;top:40px;bottom:0;width:172px;background:#fbfcfe;border-right:1px solid #edeff3;padding:12px 10px 12px}
.newmail{width:100%;height:32px;border-radius:9px;background:linear-gradient(135deg,#3f66e0,#1c46c9);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:700;box-shadow:0 6px 14px -6px rgba(30,70,201,.55)}
.sbnav{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.sbi{height:26px;border-radius:7px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:10.6px;font-weight:500;color:#48526b}

.sbi.on b{color:#1554d6}
.sbdiv{height:1px;background:#edeff3;margin:8px 2px}
.sbfoot{position:absolute;left:10px;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.sbstat{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:600;color:#5b6478;padding:0 4px}
.sbstat i{width:6px;height:6px;border-radius:50%;background:#22c55e;flex:none}
.sbstat .lbl{flex:none}
.sbstat .val{margin-left:auto;color:#8b95a7;font-weight:700}

/* ---------- email list ---------- */
.elist-col{width:390px;flex:none;position:relative;overflow:hidden;border-right:1px solid #edeff3}
.elist{position:absolute;inset:0;overflow:hidden;transition:opacity .4s ease,transform .4s ease}

.erow.unread{background:#f8faff}

.tag{flex:none;font-size:8.3px;font-weight:700;padding:2px 7px;border-radius:999px}

.erow .prev{color:#9aa4b8;font-weight:400}

/* ---------- preview pane (always visible, right of the list) ---------- */
.preview-col{flex:1;min-width:0;position:relative;overflow:hidden;background:#fff}

.pv-empty span{font-size:11.5px;font-weight:600;color:#9aa4b8}
.dl.thread .pv-empty{opacity:0;pointer-events:none}

.threadv{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s ease}

.thead{padding:14px 20px 12px;border-bottom:1px solid #f0f1f5;display:flex;align-items:flex-start;gap:10px}

.fcinput{margin-top:6px;height:27px;border-radius:7px;border:1px solid #dfe3ea;padding:0 9px;display:flex;align-items:center;font-size:9.6px;color:#c3c9d6}
.fcmeta{margin-top:6px;font-size:8.6px;color:#9aa4b8;font-weight:600}

.rchip.on .bx{background:#3f66e0;border-color:#3f66e0}
.rchip.on .bx svg{width:8px;height:8px;color:#fff}
.selnote{margin-top:8px;font-size:9.3px;color:#9aa4b8;font-weight:600}
.fwdcat{padding:11px 0;border-bottom:1px solid #f3f4f7}
.fwdcat .l1{display:flex;align-items:center;gap:10px}
.fwdcat b{font-size:10.6px;font-weight:700;flex:1}
.fwdlbl{margin-top:8px;display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#9aa4b8;font-weight:600}
.fwdlbl .lnks{display:flex;gap:10px;color:#3f66e0;font-weight:700}
.fwdinput{margin-top:6px;height:27px;border-radius:8px;border:1px solid #dfe3ea;padding:0 10px;display:flex;align-items:center;font-size:9.8px;color:#c3c9d6}
.fwdmeta{margin-top:5px;font-size:8.8px;color:#9aa4b8;font-weight:600}
.sigdesc{font-size:9.6px;color:#8b95a7;font-weight:500;line-height:1.5;margin:2px 0 6px}
.signote{margin-top:10px;padding:10px 12px;border-radius:9px;background:#eef3ff;font-size:9.3px;color:#1c2540;font-weight:500;line-height:1.5}
.signote b{color:#1554d6;font-weight:700}

.evm{position:absolute;left:50%;top:50%;width:480px;height:436px;transform:translate(-50%,-46%) scale(.96);border-radius:14px;background:#fff;box-shadow:0 40px 90px -20px rgba(10,20,50,.5);opacity:0;pointer-events:none;transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1);z-index:21;overflow:hidden}

.evh h3{font-size:13px;font-weight:800}

.evin{position:relative;transition:transform .5s cubic-bezier(.3,.8,.2,1)}

.efield label{display:block;font-size:9.3px;font-weight:700;color:#5b6478;margin-bottom:4px}
.ebox{height:28px;border-radius:8px;border:1px solid #dfe3ea;display:flex;align-items:center;padding:0 10px;font-size:10.3px;color:#c3c9d6;font-weight:500}
.ebox.filled{color:#1c2540;font-weight:600}

.etxa{min-height:36px;border-radius:8px;border:1px solid #dfe3ea;padding:8px 10px;font-size:10px;color:#c3c9d6}

.evbtn.pri{background:linear-gradient(135deg,#5b7dfb,#3f66e0);color:#fff}

.evcard{margin:0 14px 8px;padding:10px 12px;border:1px solid #eef0f4;border-radius:10px;transition:transform .5s cubic-bezier(.2,1.2,.4,1),box-shadow .5s,border-color .5s,background .5s}
.evcard .l1{display:flex;align-items:center;gap:8px}
.evcard .tm{font-size:10.3px;font-weight:700}
.evcard .st{margin-left:auto;font-size:8.3px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e2f8ef;color:#0e9f6e}
.evcard .ti{margin-top:3px;font-size:10.6px;font-weight:700;color:#1c2540}
.evcard .sub2{margin-top:2px;font-size:9px;color:#9aa4b8;font-weight:600}
.evcard.new{border-color:#c8d7fb;background:#f6f9ff;box-shadow:0 10px 24px -12px rgba(63,102,224,.5)}

.dltoast{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:11px;background:#12203f;color:#fff;font-size:10.3px;font-weight:700;box-shadow:0 16px 34px -10px rgba(10,20,50,.5);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease;z-index:30}
.dltoast.on{opacity:1;transform:none}
.dltoast i{width:20px;height:20px;border-radius:50%;background:#1c9d63;display:flex;align-items:center;justify-content:center;flex:none}
.dltoast i svg{width:11px;height:11px;color:#fff}
.dltoast span small{display:block;font-weight:600;color:#aab4cc;font-size:9px;margin-top:1px}
/* ---------- fake cursor ---------- */
.dlcur{position:absolute;left:0;top:0;width:22px;height:22px;z-index:60;pointer-events:none;opacity:0;transform:translate(700px,470px);transition:transform 1s cubic-bezier(.45,0,.2,1),opacity .35s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.dlcur.on{opacity:1}
.dlcur .rip{position:absolute;left:-9px;top:-9px;width:40px;height:40px;border-radius:50%;border:2px solid rgba(63,102,224,.55);background:rgba(91,125,251,.16);opacity:0;transform:scale(.3)}
.dlcur.clk .rip{animation:dlclick .55s ease-out}
@keyframes dlclick{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.25)}}

function dlInit(M,root){
 const q=s=>root.querySelector(s),qa=s=>Array.from(root.querySelectorAll(s));
 M.q=q; M.qa=qa; M.rootEl=root; M.dl=q('.dl');
 Object.assign(M,{cur:q('.dlcur'),elist:q('.elist'),threadv:q('.threadv'),thh2:q('.thead h2 b'),tban:q('.mban'),tmsgh:q('.mh2'),tmsgb:q('.bd2'),
  cw:q('.cw'),cwTo:q('.cwrow:nth-child(2) .val'),cwSubj:q('.cwrow:nth-child(3) .val'),cwToRow:q('.cwrow:nth-child(2)'),cwSubjRow:q('.cwrow:nth-child(3)'),
  aibar:q('.aibar'),aiph:q('.aibar .ph'),aitx:q('.aibar .tx'),aigear:q('.aigear'),aiopt:q('.aiopt'),genbtn:q('.genbtn'),selTone:q('.aisel[data-s=tone]'),selLen:q('.aisel[data-s=len]'),
  cwbody:q('.cwbody'),sendbtn:q('.sendbtn'),rec:q('.rec'),mic:q('.micbtn'),
  rc:q('.rcompose'),rcToneBtn:q('.rc-toneval'),rcTone:q('.rc-toneval .v'),rcTonePop:q('.rc-tonepop'),rcChip:q('.rc-chip'),rcBody:q('.rc-body'),rcSend:q('.rc-send'),
  appm:q('.appm'),oe:q('.oe'),pc:q('.pc'),lvl:q('.lvl'),genresp:q('.genresp'),appSend:q('.appbtn.pri'),
  setm:q('.setm'),setin:q('.setin'),evm:q('.evm'),evin:q('.evin'),
  calv:q('.calv'),calbody:q('.calbody'),calempty:q('.calempty'),
  toast:q('.dltoast'),toastTx:q('.dltoast span'),setbtn:q('.setbtn'),gearRow:q('.mh .r')});
}
function dlK(M){ return Math.max(.05,M.rootEl.getBoundingClientRect().width/1180); }
function dlPos(M,el,ox,oy){ const r=el.getBoundingClientRect(),b=M.rootEl.getBoundingClientRect(),k=dlK(M); return {x:(r.left-b.left)/k+r.width/k*(ox===undefined?.5:ox),y:(r.top-b.top)/k+r.height/k*(oy===undefined?.5:oy)}; }
function dlCurTo(M,el,ms,ox,oy){ const p=typeof el.x==='number'?el:dlPos(M,el,ox,oy); M.cur.style.transitionDuration=(ms||900)+'ms,.35s'; M.cur.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)'; }
function dlClick(M){ M.cur.classList.remove('clk'); void M.cur.offsetWidth; M.cur.classList.add('clk'); }
function dlCur(M,on){ M.cur.classList.toggle('on',!!on); }
function dlType(ctx,el,text,t0,per,onstep){ let i=0; const n=text.length; const step=()=>{ if(!ctx.live())return; i++; el.textContent=text.slice(0,i); onstep&&onstep(i); if(i<n)ctx.at(per*(.6+Math.random()*.7),step); }; ctx.at(t0,()=>{el.textContent='';step()}); return t0+n*per; }
function dlStream(ctx,el,text,t0,per,after){ const w=text.split(' '); let i=0; const step=()=>{ if(!ctx.live())return; i++; el.innerHTML=esc(w.slice(0,i).join(' '))+(i<w.length?'<i class="caret"></i>':''); el.scrollTop=el.scrollHeight; if(i<w.length)ctx.at(per*(.7+Math.random()*.6),step); else if(after)after(); }; ctx.at(t0,()=>{el.innerHTML='';step()}); return t0+w.length*per; }
function dlToast(ctx,M,t0,txt,sub){ ctx.at(t0,()=>{ M.toastTx.innerHTML=txt+(sub?'<small>'+sub+'</small>':''); M.toast.classList.add('on'); }); ctx.at(t0+2600,()=>M.toast.classList.remove('on')); }
function dlOpenThread(M,r){ M.dl.classList.add('thread'); M.thh2.textContent=r.subj; M.tban.innerHTML=''; M.tmsgh.innerHTML=dlAv(r)+'<div class="idt"><span class="nm">'+r.name+'</span><span class="to">to '+DL_USER+'</span></div><div class="r"><span class="t">Just now</span><span class="micn">'+ic('star',12,'',2)+'</span><span class="micn">'+ic('reply',12,'',2.2)+'</span><span class="micn">'+ic('more',12,'',2.4)+'</span></div>'; M.tmsgb.innerHTML='<p>'+r.prev+'</p>'; }
function dlReset(M){
 const d=M.dl; d.classList.remove('thread','compose','replying','approval','settings','event','calendar','recording');
 M.elist.querySelectorAll('.erow.new').forEach(e=>e.remove());
 M.elist.style.transform='none';
 M.toast.classList.remove('on');
 [M.cwTo,M.cwSubj].forEach(e=>{}); M.cwToRow.classList.remove('filled'); M.cwSubjRow.classList.remove('filled'); M.cwTo.textContent='Add recipients'; M.cwSubj.textContent='Subject';
 M.aiph.style.display=''; M.aitx.textContent=''; M.aibar.classList.remove('foc'); M.aiopt.classList.remove('on'); M.aigear.classList.remove('act'); M.genbtn.classList.remove('busy');
 M.selTone.querySelector('.v').textContent='Professional'; M.selLen.querySelector('.v').textContent='Medium';
 M.qa('.aipop').forEach(p=>p.classList.remove('on')); M.qa('.api').forEach(a=>a.classList.remove('hl'));
 M.q('.aisel[data-s=tone] .api').classList.add('hl'); M.q('.aisel[data-s=len] .api:nth-child(2)').classList.add('hl');
 M.cwbody.innerHTML=''; M.rec.classList.remove('on');
 M.rcBody.innerHTML=''; M.rcTone.textContent='Professional'; M.rcTonePop.classList.remove('on'); M.rcChip.innerHTML='';
 M.qa('.rc-topt').forEach(a=>a.classList.remove('hl')); M.q('.rc-topt').classList.add('hl');
 M.setin.style.transform='none'; M.evin.style.transform='none';
 M.calbody.innerHTML=dlCalHTML(); M.calempty.style.display='';
 dlCur(M,0); M.cur.style.transitionDuration='0s,.35s'; M.cur.style.transform='translate(760px,500px)';
 M.qa('.erow').forEach(e=>e.classList.remove('hl'));
}

const DEMO_URL="https://www.mortgageaitoolkit.com/products/draftlee";
const SLIDES=[
 {key:'cover',type:'cover',theme:'dark'},
 {key:'compose',theme:'dark',eyebrow:'Smart email',h:'Write better replies, faster.',
  body:['<p>Draftlee creates context-aware replies using the full email conversation, with tone options including Professional, Friendly, Formal and Casual. You stay in control before anything is sent.</p>'],badge:{i:'\u2709\ufe0f',t:'AI reply ready',pending:1}},
 {key:'automation',theme:'dark',eyebrow:'Intelligent automation',h:'Choose what gets automated and what needs approval.',
  body:['<p>Draftlee classifies incoming emails, applies confidence scoring and lets you decide whether each workflow should auto-send, request approval or stay manual.</p>'],badge:{i:'\u2699\ufe0f',t:'Automation active',pending:1}},
 {key:'meeting',theme:'dark',eyebrow:'Email operations',h:'Route emails and book meetings automatically.',
  body:['<p>Draftlee can assign messages to the right person, detect meeting requests, check availability and schedule meetings directly from the email conversation.</p>'],badge:{i:'\ud83d\udcc5',t:'Meeting booked',pending:1}},
 {key:'voice',theme:'dark',eyebrow:'Smarter productivity',h:'Use your knowledge. Use your voice. Work faster.',
  body:['<p>Connect company documents for more relevant AI replies, or use voice-to-text to write emails and create newsletter content without typing.</p>'],badge:{i:'\ud83c\udf99\ufe0f',t:'Voice to email',pending:1}},
 {key:'closing',type:'closing',theme:'brand'}
];
const REPLAY_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
const XP_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const CHEV_SVG='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
let cur=-1,stage,slideEls=[];
const isUI=d=>!d.type;
function visHTML(d,m){ const b=d.badge;
  return '<div class="vis"><div class="stagew"><div class="wcol"><div class="vbar"><span class="stat'+(b&&b.pending?' pending':'')+'" data-b>'+(b?(b.live?'<i class="dot"></i>':'')+'<span>'+b.i+'</span><span>'+b.t+'</span>':'')+'</span>'+
    '<span class="vctl"><button class="lnk replay" aria-label="Replay animation">'+REPLAY_SVG+'<span class="lbl">Replay</span></button><button class="outl enl" aria-label="Enlarge the screen">'+XP_SVG+'<span class="lbl">Enlarge</span></button></span></div>'+
    '<div class="uiw gpanel" data-w="'+m.w+'" data-h="'+m.h+'"><div class="uis"><div class="ui">'+m.html()+'</div></div></div></div></div></div>'; }
function buildSlides(){
  stage=$('#stage');
  SLIDES.forEach((d,i)=>{
    const s=document.createElement('section'); s.className='slide slide-'+d.theme; s.dataset.key=d.key; s.dataset.i=i;
    if(d.type==='cover'){
      s.classList.add('center','cover');
      s.innerHTML='<i class="glow" style="width:420px;height:420px;right:-80px;top:-100px;background:#3fb8e0"></i><i class="glow" style="width:360px;height:360px;left:-100px;bottom:-60px;background:#1c4bc4"></i>'+
        '<div class="lockup"><span class="ltile">'+dlLogo(30)+'</span><span class="word">Draftlee</span></div><div class="kicker">AI-powered email productivity</div>'+
        '<h1 class="cover-h">Wake up with zero inbox.</h1><p class="cover-s">Draft replies, automate routine emails, schedule meetings and manage workflows from one intelligent workspace.</p><p class="hintline">Swipe, or tap the arrows below \u2192</p>';
    }else if(d.type==='closing'){
      s.classList.add('center','closing');
      s.innerHTML='<div class="cl-c"><div class="lockup"><span class="ltile">'+dlLogo(30)+'</span><span class="word">Draftlee</span></div><h1 class="closing-h">Zero inbox. Every morning.</h1>'+
        '<div class="qrbox">'+QR.svg(DEMO_URL,{dark:'#0d2a86'})+'</div><div class="qrcap">Scan to try Draftlee for yourself</div></div>';
    }else{
      const m=UI[d.key];
      s.innerHTML='<div class="split"><div class="txt"><div class="eyebrow">'+d.eyebrow+'</div><h1 class="h">'+d.h+'</h1>'+
        '<button class="more-btn" aria-expanded="false" aria-controls="more-'+d.key+'"><span class="mlbl">View more</span>'+CHEV_SVG+'</button>'+
        '<div class="more" id="more-'+d.key+'"><div class="body">'+d.body.join('')+'</div></div></div>'+visHTML(d,m)+'</div>';
    }
    stage.appendChild(s); slideEls.push(s);
  });
  const pr=document.createElement('div'); pr.id='progress'; pr.innerHTML=SLIDES.map(()=>'<i class="dot"></i>').join(''); stage.appendChild(pr);
  const nb=document.createElement('div'); nb.id='navbar'; nb.innerHTML='<button class="navbtn" id="prev" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><button class="restart" id="restart">\u21ba Start again</button><button class="navbtn" id="next" aria-label="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  stage.appendChild(nb);
  const xc=document.createElement('button'); xc.className='xc'; xc.setAttribute('aria-label','Close'); xc.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'; stage.appendChild(xc);
}
function initUIs(){
  SLIDES.forEach((d,i)=>{ if(!isUI(d))return; const s=slideEls[i],m=UI[d.key],w=$('.uiw',s); m.root=$('.ui',w); m.init&&m.init(m.root,s); fitWin(w);
    const vis=$('.vis',s); if(window.ResizeObserver) new ResizeObserver(()=>fitWin(w)).observe($('.stagew',s));
    $('.replay',s).addEventListener('click',()=>{play(i)});
    $('.enl',s).addEventListener('click',e=>{e.stopPropagation();expand(vis,true)});
    const mb=$('.more-btn',s); if(mb)mb.addEventListener('click',()=>setMore(s));
  });
  window.addEventListener('resize',()=>$$('.uiw').forEach(fitWin));
  $('.xc').addEventListener('click',()=>expand($('.vis.exp'),false));
}
function setMore(s,force){ const t=$('.txt',s),b=$('.more-btn',s); if(!t||!b)return; const open=force===undefined?!t.classList.contains('open'):force; t.classList.toggle('open',open); b.setAttribute('aria-expanded',open?'true':'false'); $('.mlbl',b).textContent=open?'View less':'View more';
  let sh=0; const pn=$('.more',s); if(open&&pn&&getComputedStyle(pn).position==='absolute'){ t.style.transform=''; const nav=$('#navbar').getBoundingClientRect().top, need=t.getBoundingClientRect().bottom+18+pn.scrollHeight-(nav-10); if(need>0)sh=Math.ceil(need); }
  t.style.transform=sh?'translateY(-'+sh+'px)':''; }
function expand(vis,on){ if(!vis)return; vis.classList.toggle('exp',on); document.body.classList.toggle('exp',on); try{ if(parent!==window)parent.postMessage({mat:'exp',on:!!on},'*'); }catch(e){} requestAnimationFrame(()=>{fitWin($('.uiw',vis));setTimeout(()=>fitWin($('.uiw',vis)),60)}); }
function play(i){
  const d=SLIDES[i]; if(!isUI(d))return; const m=UI[d.key],s=slideEls[i];
  const b=$('[data-b]',s); if(b&&d.badge&&d.badge.pending){b.classList.add('pending');b.classList.remove('pop')}
  m.reset&&m.reset(); m.play&&m.play(TL.start(),{badge:on=>{ if(!b)return; if(on){b.classList.remove('pending');b.classList.add('pop')}else{b.classList.add('pending');b.classList.remove('pop')} }});
}
function go(n){
  n=Math.max(0,Math.min(SLIDES.length-1,n)); if(n===cur)return;
  if(document.body.classList.contains('exp'))expand($('.vis.exp'),false);
  if(cur>=0){ const pd=SLIDES[cur]; if(isUI(pd)&&UI[pd.key].leave)UI[pd.key].leave(); }
  TL.stop(); cur=n;
  slideEls.forEach(s=>setMore(s,false));
  slideEls.forEach((s,i)=>s.classList.toggle('active',i===n));
  $('#progress').classList.remove('on-light'); $('#navbar').classList.remove('on-light');
  $$('#progress .dot').forEach((d,i)=>d.classList.toggle('filled',i<=n));
  $('#prev').disabled=n===0; const last=n===SLIDES.length-1; $('#next').style.visibility=last?'hidden':'visible'; $('#restart').style.display=last?'block':'none';
  if(isUI(SLIDES[n])){ const w=$('.uiw',slideEls[n]); fitWin(w); play(n); }
  try{history.replaceState(null,'','#'+n)}catch(e){}
}
function wireNav(){
  $('#prev').addEventListener('click',()=>go(cur-1)); $('#next').addEventListener('click',()=>go(cur+1)); $('#restart').addEventListener('click',()=>go(0));
  document.addEventListener('keydown',e=>{ if(e.target&&(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable))return;
    if(e.key==='Escape'&&document.body.classList.contains('exp')){expand($('.vis.exp'),false);return}
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1)} else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)} else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  });
  let sx=0,sy=0,st=0,ok=false;
  stage.addEventListener('touchstart',e=>{ok=!document.body.classList.contains('exp')&&!e.target.closest('input,textarea,[contenteditable="true"]');const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  stage.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<900){go(cur+(dx<0?1:-1))}},{passive:true});
}
window.addEventListener('DOMContentLoaded',()=>{
  buildSlides(); initUIs(); wireNav();
  const h=parseInt((location.hash||'').slice(1),10); go(isNaN(h)?0:h);
  window.__ready=1; const bt=document.getElementById('boot'); if(bt)bt.remove();
});
